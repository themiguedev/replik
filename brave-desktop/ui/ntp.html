<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva Pestaña</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      height: 100vh;
      background-color: #101114;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 36px 50px;
      overflow: hidden;
      position: relative;
      transition: background-image 0.6s ease-in-out;
    }

    /* Overlay oscuro sutil para máxima legibilidad */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.45) 0%, rgba(0, 0, 0, 0.15) 50%, rgba(0, 0, 0, 0.65) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .content-layer {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    /* Top Stats Widget */
    .stats-container {
      display: flex;
      gap: 36px;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
      padding: 8px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-val {
      font-size: 28px;
      font-weight: 800;
      color: #fb542b;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .stat-lbl {
      font-size: 11.5px;
      color: #e2e2e8;
      margin-top: 2px;
      font-weight: 500;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
    }

    /* Center Section */
    .center-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
    }

    .clock {
      font-size: 86px;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
      margin-bottom: 6px;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.7);
    }

    .date-str {
      font-size: 16px;
      color: #f0f0f5;
      margin-bottom: 26px;
      font-weight: 500;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    /* Search Box */
    .search-bar {
      width: 100%;
      display: flex;
      align-items: center;
      background: rgba(20, 21, 26, 0.65);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 10px 22px;
      margin-bottom: 34px;
      transition: all 0.25s ease;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .search-bar:focus-within {
      background: rgba(20, 21, 26, 0.85);
      border-color: #fb542b;
      box-shadow: 0 10px 40px rgba(251, 84, 43, 0.35);
    }

    .search-logo {
      width: 22px;
      height: 22px;
      margin-right: 14px;
    }

    .search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 15.5px;
    }

    .search-input::placeholder {
      color: #a8a8b2;
    }

    /* Top Sites */
    .top-sites {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .site-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 82px;
      cursor: pointer;
      text-decoration: none;
      color: #ffffff;
      transition: transform 0.2s ease;
    }

    .site-card:hover {
      transform: translateY(-4px);
    }

    .site-icon {
      width: 54px;
      height: 54px;
      background: rgba(20, 21, 26, 0.65);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.2s;
    }

    .site-card:hover .site-icon {
      background: rgba(30, 31, 38, 0.85);
      border-color: #fb542b;
      box-shadow: 0 6px 20px rgba(251, 84, 43, 0.3);
    }

    .site-name {
      font-size: 12px;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
      font-weight: 500;
    }

    /* Bottom Footer */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: #d1d1dc;
    }

    .wallpaper-credit {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      transition: background 0.2s;
    }

    .wallpaper-credit:hover {
      background: rgba(0, 0, 0, 0.6);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .shield-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fb542b;
      font-weight: 600;
    }

    .customize-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-weight: 500;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .customize-btn:hover {
      background: rgba(0, 0, 0, 0.65);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .ntp-modal {
      display: none;
      position: fixed;
      bottom: 70px;
      right: 50px;
      width: 320px;
      background: rgba(25, 26, 31, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
      padding: 18px;
      z-index: 100;
      flex-direction: column;
      gap: 14px;
    }
    .ntp-modal.open {
      display: flex;
    }
    .ntp-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      font-weight: 700;
      font-size: 13.5px;
    }
    .ntp-modal-close {
      background: none;
      border: none;
      color: #9e9ea7;
      cursor: pointer;
      font-size: 14px;
    }
    .ntp-modal-close:hover {
      color: #fff;
    }
    .ntp-switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }
    .ntp-switch-row input[type="checkbox"] {
      accent-color: #fb542b;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .btn-add-shortcut {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 4px;
      transition: background 0.15s;
    }
    .btn-add-shortcut:hover {
      background: rgba(251, 84, 43, 0.25);
      border-color: #fb542b;
    }
    .site-card-add {
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 82px;
      height: 76px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .site-card-add:hover {
      border-color: #fb542b;
      background: rgba(251, 84, 43, 0.1);
      transform: translateY(-4px);
    }
    .site-card-add-icon {
      font-size: 24px;
      color: #a8a8b2;
    }
    .site-card-add-text {
      font-size: 11px;
      color: #a8a8b2;
      margin-top: 4px;
    }

    /* Responsividad Adaptativa de NTP */
    @media (max-height: 750px) {
      body {
        padding: 20px 30px;
      }
      .clock {
        font-size: 56px;
      }
      .date-str {
        font-size: 14px;
        margin-bottom: 16px;
      }
      .search-bar {
        margin-bottom: 20px;
        padding: 8px 18px;
      }
      .stat-val {
        font-size: 22px;
      }
    }

    @media (max-width: 800px) {
      body {
        padding: 16px 20px;
        overflow-y: auto;
      }
      .stats-container {
        gap: 16px;
        flex-wrap: wrap;
      }
      .clock {
        font-size: 48px;
      }
      .search-bar {
        padding: 8px 16px;
      }
      .top-sites {
        gap: 12px;
      }
      .site-card {
        width: 68px;
      }
      .site-icon {
        width: 44px;
        height: 44px;
      }
    }
  </style>
</head>
<body>
  <div class="content-layer">
    <!-- Widget Superior de Estadísticas -->
    <div class="stats-container" id="stats-container">
      <div class="stat-item">
        <div class="stat-val" id="stat-ads">0</div>
        <div class="stat-lbl">Rastreadores y anuncios bloqueados</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="stat-band">0 MB</div>
        <div class="stat-lbl">Banda ancha ahorrada</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="stat-time">0 s</div>
        <div class="stat-lbl">Tiempo ahorrado</div>
      </div>
    </div>

    <!-- Sección Central: Reloj y Buscador -->
    <div class="center-container">
      <div id="clock-container" style="display: flex; flex-direction: column; align-items: center;">
        <div class="clock" id="clock">12:00</div>
        <div class="date-str" id="date-str">Cargando fecha...</div>
      </div>

      <form class="search-bar" id="search-form">
        <img class="search-logo" src="logo.png" alt="Brave">
        <input type="text" class="search-input" id="search-input" placeholder="Buscar en la web con Brave..." autofocus>
      </form>

      <!-- Sitios Frecuentes / Top Sites -->
      <div class="top-sites" id="top-sites-container">
        <!-- Renderizado dinámico -->
      </div>
    </div>

    <!-- Pie de Página: Crédito de Foto y Personalización -->
    <div class="footer">
      <div class="wallpaper-credit" id="wallpaper-btn" title="Clic para cambiar fondo">
        <span>📷</span>
        <span id="photo-credit">Foto por Daniel Schwarz en Unsplash</span>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <button class="customize-btn" id="btn-customize-ntp" title="Personalizar panel de Nueva Pestaña">
          <span>⚙️</span>
          <span>Personalizar</span>
        </button>

        <div class="shield-badge">
          <span>🛡️</span>
          <span>Brave Shields v1.0 Activo</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal / Flyout de Personalización de la Nueva Pestaña -->
  <div class="ntp-modal" id="ntp-modal">
    <div class="ntp-modal-header">
      <span>Personalizar panel</span>
      <button class="ntp-modal-close" id="btn-close-ntp-modal">✕</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <label class="ntp-switch-row">
        <span>Estadísticas de Shields</span>
        <input type="checkbox" id="chk-ntp-stats" checked>
      </label>
      <label class="ntp-switch-row">
        <span>Reloj y fecha</span>
        <input type="checkbox" id="chk-ntp-clock" checked>
      </label>
      <label class="ntp-switch-row">
        <span>Sitios frecuentes</span>
        <input type="checkbox" id="chk-ntp-sites" checked>
      </label>
    </div>
    <button class="btn-add-shortcut" id="btn-modal-add-shortcut">
      <span>➕</span>
      <span>Añadir acceso directo</span>
    </button>
  </div>

  <script>
    // Catálogo oficial de fondos fotográficos
    const wallpapers = [
      { file: 'wallpapers/daniel-schwarz.jpg', author: 'Daniel Schwarz', location: 'Montañas y Lago' },
      { file: 'wallpapers/pascal-debrunner.jpg', author: 'Pascal Debrunner', location: 'Picos Rocosos al Amanecer' },
      { file: 'wallpapers/david-becker.jpg', author: 'David Becker', location: 'Atardecer en la Costa' },
      { file: 'wallpapers/hunter-newton.jpg', author: 'Hunter Newton', location: 'Cascada en Bosque Profundo' },
      { file: 'wallpapers/andrew-svk.jpg', author: 'Andrew Svk', location: 'Cadena Montañosa con Cielo Rosa' },
      { file: 'wallpapers/rafael-peier2.jpg', author: 'Rafael Peier', location: 'Dunas Doradas al Atardecer' },
    ];

    let currentWpIndex = Math.floor(Math.random() * wallpapers.length);

    function applyWallpaper(idx) {
      const wp = wallpapers[idx];
      document.body.style.backgroundImage = `url('${wp.file}')`;
      document.getElementById('photo-credit').textContent = `Foto por ${wp.author} en Unsplash (${wp.location})`;
    }

    applyWallpaper(currentWpIndex);

    document.getElementById('wallpaper-btn').addEventListener('click', () => {
      currentWpIndex = (currentWpIndex + 1) % wallpapers.length;
      applyWallpaper(currentWpIndex);
    });

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock').textContent = `${hours}:${minutes}`;

      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      const dateStr = now.toLocaleDateString('es-ES', options);
      document.getElementById('date-str').textContent = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
    }

    updateClock();
    setInterval(updateClock, 1000);

    async function loadStats() {
      if (window.braveAPI && window.braveAPI.getShieldsStats) {
        try {
          const stats = await window.braveAPI.getShieldsStats();
          if (stats && typeof stats.totalBlocked === 'number') {
            document.getElementById('stat-ads').textContent = stats.totalBlocked.toLocaleString();
            document.getElementById('stat-band').textContent = `${stats.globalBandwidthMB} MB`;
            document.getElementById('stat-time').textContent = stats.globalTimeSaved;
            return;
          }
        } catch {}
      }

      const adsBlocked = parseInt(localStorage.getItem('brave_total_ads') || '0', 10);
      document.getElementById('stat-ads').textContent = adsBlocked.toLocaleString();

      const mbSaved = localStorage.getItem('brave_mb_saved') || ((adsBlocked * 34.2) / 1024).toFixed(1);
      document.getElementById('stat-band').textContent = `${mbSaved} MB`;

      const secondsSaved = parseInt(localStorage.getItem('brave_time_saved') || String(Math.round((adsBlocked * 65) / 1000)), 10);
      if (secondsSaved >= 60) {
        document.getElementById('stat-time').textContent = `${(secondsSaved / 60).toFixed(1)} m`;
      } else {
        document.getElementById('stat-time').textContent = `${secondsSaved} s`;
      }
    }

    function updateSearchPlaceholder() {
      const searchInput = document.getElementById('search-input');
      if (!searchInput) return;
      const engine = localStorage.getItem('brave_setting_engine') || 'brave';
      const names = {
        google: 'Google',
        duckduckgo: 'DuckDuckGo',
        bing: 'Bing',
        qwant: 'Qwant',
        brave: 'Brave',
      };
      const name = names[engine] || 'Brave';
      searchInput.placeholder = `Buscar en la web con ${name}...`;
    }

    window.addEventListener('brave-bridge-ready', () => {
      loadStats();
      updateSearchPlaceholder();
    });
    loadStats();
    updateSearchPlaceholder();
    window.addEventListener('storage', () => {
      loadStats();
      updateSearchPlaceholder();
    });

    function getSearchUrl(query) {
      let engine = localStorage.getItem('brave_setting_engine') || 'brave';
      const q = encodeURIComponent(query);
      switch (engine) {
        case 'google':
          return `https://www.google.com/search?q=${q}`;
        case 'duckduckgo':
          return `https://duckduckgo.com/?q=${q}`;
        case 'bing':
          return `https://www.bing.com/search?q=${q}`;
        case 'qwant':
          return `https://www.qwant.com/?q=${q}`;
        case 'brave':
        default:
          return `https://search.brave.com/search?q=${q}`;
      }
    }

    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;

      if (/^https?:\/\//i.test(query) || (query.includes('.') && !query.includes(' '))) {
        window.location.href = query.startsWith('http') ? query : 'https://' + query;
      } else {
        window.location.href = getSearchUrl(query);
      }
    });

    // Gestión y renderizado de Accesos Directos (Top Sites)
    const defaultSites = [
      { name: 'Brave Search', url: 'https://search.brave.com', icon: '🦁' },
      { name: 'YouTube', url: 'https://www.youtube.com', icon: '▶️' },
      { name: 'GitHub', url: 'https://github.com', icon: '🐙' },
      { name: 'Wikipedia', url: 'https://www.wikipedia.org', icon: '📖' },
      { name: 'Reddit', url: 'https://www.reddit.com', icon: '🤖' },
      { name: 'X / Twitter', url: 'https://twitter.com', icon: '🐦' }
    ];

    function getTopSites() {
      try {
        const custom = JSON.parse(localStorage.getItem('ntp_custom_sites'));
        if (Array.isArray(custom)) return custom;
      } catch {}
      return defaultSites;
    }

    function renderTopSites() {
      const container = document.getElementById('top-sites-container');
      if (!container) return;
      container.innerHTML = '';
      const list = getTopSites();

      list.forEach((s, idx) => {
        const a = document.createElement('a');
        a.className = 'site-card';
        a.href = s.url;
        a.innerHTML = `
          <div class="site-icon">${s.icon || '🌐'}</div>
          <div class="site-name">${s.name}</div>
        `;
        a.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          if (confirm(`¿Eliminar acceso directo a "${s.name}"?`)) {
            list.splice(idx, 1);
            localStorage.setItem('ntp_custom_sites', JSON.stringify(list));
            renderTopSites();
          }
        });
        container.appendChild(a);
      });

      // Tarjeta "+" para añadir acceso directo
      const addCard = document.createElement('div');
      addCard.className = 'site-card-add';
      addCard.innerHTML = `
        <div class="site-card-add-icon">+</div>
        <div class="site-card-add-text">Añadir</div>
      `;
      addCard.addEventListener('click', promptAddShortcut);
      container.appendChild(addCard);
    }

    function promptAddShortcut() {
      const name = prompt('Nombre del acceso directo (ej. Google):');
      if (!name) return;
      const url = prompt('URL del sitio (ej. https://google.com):');
      if (!url) return;
      const fullUrl = url.startsWith('http') ? url : 'https://' + url;
      const list = getTopSites();
      list.push({ name, url: fullUrl, icon: '⭐' });
      localStorage.setItem('ntp_custom_sites', JSON.stringify(list));
      renderTopSites();
    }

    renderTopSites();

    // Personalización del panel NTP (Toggles)
    const ntpModal = document.getElementById('ntp-modal');
    const btnCustomize = document.getElementById('btn-customize-ntp');
    const btnCloseNtpModal = document.getElementById('btn-close-ntp-modal');
    const btnModalAddShortcut = document.getElementById('btn-modal-add-shortcut');

    const chkNtpStats = document.getElementById('chk-ntp-stats');
    const chkNtpClock = document.getElementById('chk-ntp-clock');
    const chkNtpSites = document.getElementById('chk-ntp-sites');

    const statsContainer = document.getElementById('stats-container');
    const clockContainer = document.getElementById('clock-container');
    const topSitesContainer = document.getElementById('top-sites-container');

    function applyNtpVisibility() {
      const showStats = localStorage.getItem('ntp_show_stats') !== 'false';
      const showClock = localStorage.getItem('ntp_show_clock') !== 'false';
      const showSites = localStorage.getItem('ntp_show_sites') !== 'false';

      if (chkNtpStats) chkNtpStats.checked = showStats;
      if (chkNtpClock) chkNtpClock.checked = showClock;
      if (chkNtpSites) chkNtpSites.checked = showSites;

      if (statsContainer) statsContainer.style.display = showStats ? 'flex' : 'none';
      if (clockContainer) clockContainer.style.display = showClock ? 'flex' : 'none';
      if (topSitesContainer) topSitesContainer.style.display = showSites ? 'flex' : 'none';
    }

    applyNtpVisibility();

    if (btnCustomize) {
      btnCustomize.addEventListener('click', (e) => {
        e.stopPropagation();
        if (ntpModal) ntpModal.classList.toggle('open');
      });
    }

    if (btnCloseNtpModal) {
      btnCloseNtpModal.addEventListener('click', () => {
        if (ntpModal) ntpModal.classList.remove('open');
      });
    }

    if (btnModalAddShortcut) {
      btnModalAddShortcut.addEventListener('click', () => {
        if (ntpModal) ntpModal.classList.remove('open');
        promptAddShortcut();
      });
    }

    if (chkNtpStats) {
      chkNtpStats.addEventListener('change', () => {
        localStorage.setItem('ntp_show_stats', String(chkNtpStats.checked));
        applyNtpVisibility();
      });
    }

    if (chkNtpClock) {
      chkNtpClock.addEventListener('change', () => {
        localStorage.setItem('ntp_show_clock', String(chkNtpClock.checked));
        applyNtpVisibility();
      });
    }

    if (chkNtpSites) {
      chkNtpSites.addEventListener('change', () => {
        localStorage.setItem('ntp_show_sites', String(chkNtpSites.checked));
        applyNtpVisibility();
      });
    }

    document.addEventListener('click', (e) => {
      if (ntpModal && ntpModal.classList.contains('open')) {
        if (!ntpModal.contains(e.target) && e.target !== btnCustomize && !btnCustomize.contains(e.target)) {
          ntpModal.classList.remove('open');
        }
      }
    });
  </script>
</body>
</html>
