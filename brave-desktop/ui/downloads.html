<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Descargas - Brave</title>
  <style>
    :root {
      --bg-page: #19191c;
      --bg-card: #212226;
      --border-color: #2e2f38;
      --brave-orange: #fb542b;
      --text-main: #ffffff;
      --text-muted: #9e9ea7;
      --text-sub: #72727d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      padding: 36px 60px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      max-width: 820px;
      width: 100%;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-icon {
      font-size: 26px;
    }

    .title-text {
      font-size: 24px;
      font-weight: 700;
    }

    .search-box {
      width: 100%;
      max-width: 820px;
      display: flex;
      align-items: center;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 8px 18px;
      margin-bottom: 28px;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 14.5px;
    }

    .downloads-list {
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .download-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      transition: background 0.15s;
    }

    .download-card:hover {
      background-color: rgba(255, 255, 255, 0.04);
    }

    .file-icon {
      font-size: 32px;
    }

    .file-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .file-name {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-main);
    }

    .file-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .file-status {
      color: #4ade80;
      font-size: 11.5px;
      font-weight: 600;
    }

    .btn-folder {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-folder:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--brave-orange);
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      background-color: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      max-width: 820px;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="title-group">
      <span class="title-icon">📥</span>
      <span class="title-text">Descargas</span>
    </div>
  </div>

  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="search-input" placeholder="Buscar en las descargas...">
  </div>

  <div class="downloads-list" id="downloads-container">
    <div class="download-card">
      <span class="file-icon">📦</span>
      <div class="file-details">
        <div class="file-name">Brave-Replica-Portable.exe</div>
        <div class="file-meta">99.5 MB • Descargado hoy • Completada</div>
        <div class="file-status">✓ Descarga completa y verificada</div>
      </div>
      <button class="btn-folder" onclick="alert('Abriendo carpeta de descargas...')">Mostrar en carpeta</button>
    </div>

    <div class="download-card">
      <span class="file-icon">📄</span>
      <div class="file-details">
        <div class="file-name">query-filter.json</div>
        <div class="file-meta">2.4 KB • Descargado hoy • Completada</div>
        <div class="file-status">✓ Descarga completa y verificada</div>
      </div>
      <button class="btn-folder" onclick="alert('Abriendo carpeta de descargas...')">Mostrar en carpeta</button>
    </div>
  </div>

  <script>
    document.getElementById('search-input').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      document.querySelectorAll('.download-card').forEach(card => {
        const text = card.textContent.toLowerCase();
        card.style.display = text.includes(q) ? 'flex' : 'none';
      });
    });
  </script>
</body>
</html>
