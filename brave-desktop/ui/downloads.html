<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Descargas - Brave</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root {
      --bg-page: #19191c;
      --bg-card: #212226;
      --border-color: #2e2f38;
      --brave-orange: #fb542b;
      --text-main: #ffffff;
      --text-muted: #9e9ea7;
      --text-sub: #72727d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      padding: 36px 60px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      max-width: 860px;
      width: 100%;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-icon {
      font-size: 26px;
    }

    .title-text {
      font-size: 24px;
      font-weight: 700;
    }

    .btn-clear {
      background: rgba(251, 84, 43, 0.15);
      border: 1px solid rgba(251, 84, 43, 0.4);
      color: var(--brave-orange);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-clear:hover {
      background: var(--brave-orange);
      color: #ffffff;
    }

    .search-box {
      width: 100%;
      max-width: 860px;
      display: flex;
      align-items: center;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 8px 18px;
      margin-bottom: 28px;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 14.5px;
    }

    .downloads-list {
      max-width: 860px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .download-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 18px;
      transition: background 0.15s;
    }

    .download-card:hover {
      background-color: rgba(255, 255, 255, 0.04);
    }

    .file-icon {
      font-size: 32px;
    }

    .file-details {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }

    .file-name {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .file-name:hover {
      color: var(--brave-orange);
      text-decoration: underline;
    }

    .file-meta {
      font-size: 12px;
      color: var(--text-muted);
    }

    .file-status {
      color: #4ade80;
      font-size: 11.5px;
      font-weight: 600;
    }

    .file-status.failed {
      color: #f87171;
    }

    .action-buttons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-folder {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-folder:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--brave-orange);
    }

    .btn-del-dl {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 16px;
      padding: 6px;
      border-radius: 4px;
      transition: color 0.15s;
    }

    .btn-del-dl:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      background-color: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      max-width: 860px;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="title-group">
      <span class="title-icon">📥</span>
      <span class="title-text">Descargas</span>
    </div>
    <button class="btn-clear" id="btn-clear-downloads">Borrar historial de descargas</button>
  </div>

  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="search-input" placeholder="Buscar en las descargas...">
  </div>

  <div class="downloads-list" id="downloads-container">
    <!-- Renderizado dinámico -->
  </div>

  <script>
    let downloads = [];

    function formatBytes(bytes) {
      if (!bytes || isNaN(bytes)) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return (bytes / Math.pow(k, i)).toFixed(1) + ' ' + sizes[i];
    }

    function getFileIcon(name) {
      const ext = (name || '').split('.').pop().toLowerCase();
      if (['exe', 'msi', 'bat'].includes(ext)) return '📦';
      if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return '🗜️';
      if (['pdf', 'doc', 'docx', 'txt'].includes(ext)) return '📄';
      if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) return '🖼️';
      if (['mp4', 'mkv', 'webm', 'mov'].includes(ext)) return '🎬';
      if (['mp3', 'wav', 'ogg', 'flac'].includes(ext)) return '🎵';
      return '📥';
    }

    async function loadDownloads() {
      if (window.braveAPI && window.braveAPI.getDownloads) {
        try {
          downloads = await window.braveAPI.getDownloads();
          if (Array.isArray(downloads)) {
            renderDownloads();
            return;
          }
        } catch {}
      }

      try {
        downloads = JSON.parse(localStorage.getItem('brave_downloads') || '[]');
      } catch {
        downloads = [];
      }
      renderDownloads();
    }

    function renderDownloads(filterText = '') {
      const container = document.getElementById('downloads-container');
      container.innerHTML = '';

      const q = filterText.toLowerCase().trim();
      const filtered = downloads.filter(d => 
        (d.filename || '').toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state">No hay descargas registradas.</div>';
        return;
      }

      filtered.forEach((d) => {
        const card = document.createElement('div');
        card.className = 'download-card';

        const sizeFormatted = d.totalBytes ? formatBytes(d.totalBytes) : 'Tamaño desconocido';
        const dateFormatted = d.date ? new Date(d.date).toLocaleString('es-ES', { dateStyle: 'short', timeStyle: 'short' }) : 'Reciente';
        const isCompleted = d.state === 'completed' || !d.state;
        const icon = getFileIcon(d.filename);

        card.innerHTML = `
          <span class="file-icon">${icon}</span>
          <div class="file-details">
            <div class="file-name" title="Abrir archivo" data-path="${escapeAttr(d.savePath || '')}">${escapeHtml(d.filename || 'Archivo')}</div>
            <div class="file-meta">${sizeFormatted} • ${dateFormatted}</div>
            <div class="file-status ${isCompleted ? '' : 'failed'}">${isCompleted ? '✓ Descarga completada' : '✕ Descarga interrumpida o cancelada'}</div>
          </div>
          <div class="action-buttons">
            <button class="btn-folder btn-open" data-path="${escapeAttr(d.savePath || '')}">Abrir</button>
            <button class="btn-folder btn-folder-view" data-path="${escapeAttr(d.savePath || '')}">Mostrar en carpeta</button>
            <button class="btn-del-dl" title="Eliminar de la lista" data-id="${escapeAttr(d.id || '')}">✕</button>
          </div>
        `;
        container.appendChild(card);
      });

      // Eventos
      document.querySelectorAll('.file-name, .btn-open').forEach(el => {
        el.addEventListener('click', (e) => {
          const p = e.currentTarget.getAttribute('data-path');
          if (p && window.braveAPI && window.braveAPI.openPath) {
            window.braveAPI.openPath(p);
          }
        });
      });

      document.querySelectorAll('.btn-folder-view').forEach(el => {
        el.addEventListener('click', (e) => {
          const p = e.currentTarget.getAttribute('data-path');
          if (p && window.braveAPI && window.braveAPI.showItemInFolder) {
            window.braveAPI.showItemInFolder(p);
          }
        });
      });

      document.querySelectorAll('.btn-del-dl').forEach(el => {
        el.addEventListener('click', async (e) => {
          const id = e.currentTarget.getAttribute('data-id');
          if (window.braveAPI && window.braveAPI.deleteDownload) {
            await window.braveAPI.deleteDownload(id);
          }
          downloads = downloads.filter(x => x.id !== id);
          localStorage.setItem('brave_downloads', JSON.stringify(downloads));
          renderDownloads(document.getElementById('search-input').value);
        });
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function escapeAttr(text) {
      return (text || '').replace(/"/g, '&quot;');
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      renderDownloads(e.target.value);
    });

    document.getElementById('btn-clear-downloads').addEventListener('click', async () => {
      if (confirm('¿Deseas eliminar todo el historial de descargas? (Los archivos descargados no se borrarán del disco)')) {
        if (window.braveAPI && window.braveAPI.clearDownloads) {
          await window.braveAPI.clearDownloads();
        }
        downloads = [];
        localStorage.removeItem('brave_downloads');
        renderDownloads();
      }
    });

    window.addEventListener('brave-bridge-ready', loadDownloads);
    loadDownloads();
  </script>
</body>
</html>
