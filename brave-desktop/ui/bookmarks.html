<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Marcadores - Brave</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root {
      --bg-page: #19191c;
      --bg-card: #212226;
      --bg-card-hover: rgba(255, 255, 255, 0.04);
      --border-color: #2e2f38;
      --brave-orange: #fb542b;
      --text-main: #ffffff;
      --text-muted: #9e9ea7;
      --text-sub: #72727d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Barra Lateral de Carpetas */
    .sidebar {
      width: 240px;
      background-color: #161619;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 24px 16px;
      gap: 8px;
    }

    .sidebar-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-left: 8px;
    }

    .folder-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13.5px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.15s;
    }

    .folder-item:hover {
      background-color: var(--bg-card-hover);
      color: var(--text-main);
    }

    .folder-item.active {
      background-color: rgba(251, 84, 43, 0.15);
      color: var(--brave-orange);
      font-weight: 600;
    }

    .folder-count {
      font-size: 11px;
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 10px;
      color: var(--text-muted);
    }

    .bm-folder-badge {
      font-size: 10.5px;
      background: rgba(251, 84, 43, 0.12);
      color: var(--brave-orange);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      margin-left: 8px;
    }

    .folder-del-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 11px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .folder-item:hover .folder-del-btn {
      opacity: 1;
    }

    .folder-del-btn:hover {
      color: #ef4444;
    }

    /* Contenido Principal */
    .main-view {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 32px 48px;
      overflow-y: auto;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      max-width: 900px;
      width: 100%;
    }

    .action-group {
      display: flex;
      gap: 10px;
    }

    .btn-action {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-action:hover {
      background-color: rgba(255, 255, 255, 0.08);
      border-color: var(--brave-orange);
    }

    .btn-primary {
      background-color: var(--brave-orange);
      border-color: var(--brave-orange);
      color: #ffffff;
      font-weight: 600;
    }

    .btn-primary:hover {
      background-color: #e0441d;
    }

    .search-box {
      width: 100%;
      max-width: 900px;
      display: flex;
      align-items: center;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 8px 18px;
      margin-bottom: 24px;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 14px;
    }

    .bookmarks-container {
      width: 100%;
      max-width: 900px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .bookmark-row {
      display: flex;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border-color);
      font-size: 13.5px;
      gap: 14px;
      transition: background 0.15s;
    }

    .bookmark-row:last-child {
      border-bottom: none;
    }

    .bookmark-row:hover {
      background-color: var(--bg-card-hover);
    }

    .bm-icon {
      font-size: 18px;
    }

    .bm-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-decoration: none;
      color: var(--text-main);
      overflow: hidden;
    }

    .bm-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bm-title:hover {
      color: var(--brave-orange);
    }

    .bm-url {
      font-size: 11.5px;
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bm-actions {
      display: flex;
      gap: 8px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .bookmark-row:hover .bm-actions {
      opacity: 1;
    }

    .bm-btn-icon {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .bm-btn-icon:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Modal para añadir/editar */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: #24252a;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 440px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
    }

    .input-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .input-field input {
      background: #18191c;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      color: var(--text-main);
      font-size: 13.5px;
      outline: none;
    }

    .input-field input:focus {
      border-color: var(--brave-orange);
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-title">
      <img src="logo.png" width="18" height="18" style="vertical-align: middle; margin-right: 6px; object-fit: contain;">
      <span>Marcadores</span>
    </div>
    <div class="folder-item active" data-folder="all">
      <span>📂</span>
      <span style="flex:1;">Todos los marcadores</span>
      <span class="folder-count" id="count-all">0</span>
    </div>
    <div class="folder-item" data-folder="bar">
      <span>⭐</span>
      <span style="flex:1;">Barra de marcadores</span>
      <span class="folder-count" id="count-bar">0</span>
    </div>
    <div class="folder-item" data-folder="other">
      <span>📁</span>
      <span style="flex:1;">Otros marcadores</span>
      <span class="folder-count" id="count-other">0</span>
    </div>
    <div style="height: 1px; background: var(--border-color); margin: 6px 0;"></div>
    <div id="custom-folders-container" style="display: flex; flex-direction: column; gap: 4px;"></div>
    <button class="btn-action" id="btn-new-folder" style="margin-top: 8px; justify-content: center; font-size: 12px;">
      ➕ Nueva carpeta
    </button>
  </div>

  <div class="main-view">
    <div class="header-bar">
      <h1 style="font-size: 22px;">Gestor de Marcadores</h1>
      <div class="action-group">
        <button class="btn-action btn-primary" id="btn-add-modal">➕ Añadir marcador</button>
        <button class="btn-action" id="btn-import">📥 Importar (HTML)</button>
        <button class="btn-action" id="btn-export">📤 Exportar (HTML)</button>
      </div>
    </div>

    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="search-input" placeholder="Buscar en los marcadores...">
    </div>

    <div class="bookmarks-container" id="bookmarks-list">
      <!-- Elementos renderizados dinámicamente -->
    </div>
  </div>

  <input type="file" id="file-import" accept=".html,.htm" style="display:none">

  <!-- Modal Añadir / Editar -->
  <div class="modal-overlay" id="bm-modal">
    <div class="modal-card">
      <div class="modal-title" id="modal-heading">Añadir marcador</div>
      <div class="input-field">
        <label>Nombre:</label>
        <input type="text" id="bm-input-title" placeholder="ej. Brave Search">
      </div>
      <div class="input-field">
        <label>URL:</label>
        <input type="text" id="bm-input-url" placeholder="https://search.brave.com">
      </div>
      <div class="input-field">
        <label>Carpeta:</label>
        <select id="bm-input-folder" style="background:#18191c; border:1px solid var(--border-color); padding:8px 12px; border-radius:6px; color:var(--text-main); font-size:13.5px; outline:none;">
          <option value="bar">Barra de marcadores</option>
          <option value="other">Otros marcadores</option>
        </select>
      </div>
      <div class="modal-buttons">
        <button class="btn-action" id="btn-cancel-modal">Cancelar</button>
        <button class="btn-action btn-primary" id="btn-save-modal">Guardar</button>
      </div>
    </div>
  </div>

  <script>
    let bookmarks = [];
    let editIndex = -1;
    let currentFolder = 'all';
    let customFolders = [];
    try {
      customFolders = JSON.parse(localStorage.getItem('brave_bookmark_folders') || '["Favoritos", "Trabajo"]');
    } catch {
      customFolders = ["Favoritos", "Trabajo"];
    }

    function saveCustomFolders() {
      localStorage.setItem('brave_bookmark_folders', JSON.stringify(customFolders));
      renderFolders();
    }

    function renderFolders() {
      const container = document.getElementById('custom-folders-container');
      if (container) {
        container.innerHTML = '';
        customFolders.forEach((folderName) => {
          const item = document.createElement('div');
          item.className = `folder-item ${currentFolder === folderName ? 'active' : ''}`;
          item.setAttribute('data-folder', folderName);
          const count = bookmarks.filter(b => b.folder === folderName).length;
          item.innerHTML = `
            <span>📁</span>
            <span style="flex:1;">${escapeHtml(folderName)}</span>
            <span class="folder-count">${count}</span>
            <button class="folder-del-btn" title="Eliminar carpeta" data-folder="${escapeHtml(folderName)}">✕</button>
          `;
          container.appendChild(item);
        });

        container.querySelectorAll('.folder-del-btn').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const fName = btn.getAttribute('data-folder');
            if (confirm(`¿Eliminar la carpeta "${fName}"? Los marcadores se moverán a Otros marcadores.`)) {
              customFolders = customFolders.filter(f => f !== fName);
              bookmarks.forEach(b => { if (b.folder === fName) b.folder = 'other'; });
              saveBookmarks();
              saveCustomFolders();
              if (currentFolder === fName) currentFolder = 'all';
              renderFolders();
              renderList(document.getElementById('search-input').value);
            }
          });
        });
      }

      // Conteo de carpetas predeterminadas
      const countAll = document.getElementById('count-all');
      const countBar = document.getElementById('count-bar');
      const countOther = document.getElementById('count-other');
      if (countAll) countAll.textContent = bookmarks.length;
      if (countBar) countBar.textContent = bookmarks.filter(b => (!b.folder || b.folder === 'bar')).length;
      if (countOther) countOther.textContent = bookmarks.filter(b => b.folder === 'other').length;

      // Eventos de selección de carpetas
      document.querySelectorAll('.folder-item').forEach((item) => {
        item.onclick = () => {
          document.querySelectorAll('.folder-item').forEach(f => f.classList.remove('active'));
          item.classList.add('active');
          currentFolder = item.getAttribute('data-folder');
          renderList(document.getElementById('search-input').value);
        };
      });

      // Actualizar opciones en el selector del modal
      const folderSelect = document.getElementById('bm-input-folder');
      if (folderSelect) {
        folderSelect.innerHTML = `
          <option value="bar">Barra de marcadores</option>
          <option value="other">Otros marcadores</option>
        `;
        customFolders.forEach((f) => {
          const opt = document.createElement('option');
          opt.value = f;
          opt.textContent = f;
          folderSelect.appendChild(opt);
        });
      }
    }

    const btnNewFolder = document.getElementById('btn-new-folder');
    if (btnNewFolder) {
      btnNewFolder.addEventListener('click', () => {
        const name = prompt('Nombre de la nueva carpeta:');
        if (name && name.trim()) {
          const trimmed = name.trim();
          if (!customFolders.includes(trimmed)) {
            customFolders.push(trimmed);
            saveCustomFolders();
          }
        }
      });
    }

    async function loadBookmarks() {
      if (window.braveAPI && window.braveAPI.getBookmarks) {
        try {
          bookmarks = await window.braveAPI.getBookmarks();
          if (Array.isArray(bookmarks) && bookmarks.length > 0) {
            renderFolders();
            renderList();
            return;
          }
        } catch {}
      }

      try {
        bookmarks = JSON.parse(localStorage.getItem('brave_bookmarks') || '[]');
      } catch {
        bookmarks = [];
      }

      if (bookmarks.length === 0) {
        bookmarks = [
          { title: 'Brave Search', url: 'https://search.brave.com', folder: 'bar' },
          { title: 'YouTube', url: 'https://youtube.com', folder: 'bar' },
          { title: 'GitHub', url: 'https://github.com', folder: 'Favoritos' },
          { title: 'Wikipedia', url: 'https://wikipedia.org', folder: 'other' }
        ];
        saveBookmarks();
      }
      renderFolders();
      renderList();
    }

    async function saveBookmarks() {
      localStorage.setItem('brave_bookmarks', JSON.stringify(bookmarks));
      if (window.braveAPI && window.braveAPI.saveBookmarks) {
        try {
          await window.braveAPI.saveBookmarks(bookmarks);
        } catch {}
      }
      renderFolders();
    }

    function renderList(filter = '') {
      const container = document.getElementById('bookmarks-list');
      container.innerHTML = '';

      const q = filter.toLowerCase().trim();
      let filtered = bookmarks.filter(b => 
        (b.title || '').toLowerCase().includes(q) || 
        (b.url || '').toLowerCase().includes(q)
      );

      if (currentFolder !== 'all') {
        filtered = filtered.filter(b => {
          const f = b.folder || 'bar';
          return f === currentFolder;
        });
      }

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">${q ? 'No se encontraron marcadores coincidentes.' : 'Esta carpeta está vacía.'}</div>`;
        return;
      }

      filtered.forEach((bm) => {
        const realIdx = bookmarks.indexOf(bm);
        const row = document.createElement('div');
        row.className = 'bookmark-row';
        const folderLabel = bm.folder === 'bar' ? 'Barra' : (bm.folder === 'other' ? 'Otros' : (bm.folder || 'Barra'));
        row.innerHTML = `
          <div class="bm-icon">🔖</div>
          <a class="bm-info" href="${bm.url}" target="_blank">
            <div style="display:flex; align-items:center;">
              <span class="bm-title">${escapeHtml(bm.title || bm.url)}</span>
              <span class="bm-folder-badge">${escapeHtml(folderLabel)}</span>
            </div>
            <span class="bm-url">${escapeHtml(bm.url)}</span>
          </a>
          <div class="bm-actions">
            <button class="bm-btn-icon btn-edit" title="Editar" data-idx="${realIdx}">✏️</button>
            <button class="bm-btn-icon btn-del" title="Eliminar" data-idx="${realIdx}">🗑️</button>
          </div>
        `;
        container.appendChild(row);
      });

      document.querySelectorAll('.btn-edit').forEach(b => {
        b.addEventListener('click', (e) => {
          editIndex = parseInt(e.currentTarget.getAttribute('data-idx'), 10);
          openEditModal(editIndex);
        });
      });

      document.querySelectorAll('.btn-del').forEach(b => {
        b.addEventListener('click', async (e) => {
          const idx = parseInt(e.currentTarget.getAttribute('data-idx'), 10);
          if (confirm(`¿Eliminar marcador "${bookmarks[idx].title}"?`)) {
            bookmarks.splice(idx, 1);
            await saveBookmarks();
            renderList(document.getElementById('search-input').value);
          }
        });
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Modal
    const modal = document.getElementById('bm-modal');
    const inputTitle = document.getElementById('bm-input-title');
    const inputUrl = document.getElementById('bm-input-url');
    const inputFolder = document.getElementById('bm-input-folder');

    document.getElementById('btn-add-modal').addEventListener('click', () => {
      editIndex = -1;
      document.getElementById('modal-heading').textContent = 'Añadir marcador';
      inputTitle.value = '';
      inputUrl.value = 'https://';
      if (inputFolder) {
        inputFolder.value = (currentFolder !== 'all') ? currentFolder : 'bar';
      }
      modal.classList.add('open');
      inputTitle.focus();
    });

    function openEditModal(idx) {
      document.getElementById('modal-heading').textContent = 'Editar marcador';
      inputTitle.value = bookmarks[idx].title || '';
      inputUrl.value = bookmarks[idx].url || '';
      if (inputFolder) {
        inputFolder.value = bookmarks[idx].folder || 'bar';
      }
      modal.classList.add('open');
      inputTitle.focus();
    }

    document.getElementById('btn-cancel-modal').addEventListener('click', () => {
      modal.classList.remove('open');
    });

    document.getElementById('btn-save-modal').addEventListener('click', async () => {
      const title = inputTitle.value.trim() || 'Nuevo Marcador';
      let url = inputUrl.value.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
      const folder = inputFolder ? inputFolder.value : 'bar';

      if (editIndex >= 0) {
        bookmarks[editIndex] = { ...bookmarks[editIndex], title, url, folder };
      } else {
        bookmarks.unshift({ title, url, folder });
      }

      await saveBookmarks();
      modal.classList.remove('open');
      renderList(document.getElementById('search-input').value);
    });

    // Búsqueda en vivo
    document.getElementById('search-input').addEventListener('input', (e) => {
      renderList(e.target.value);
    });

    // Exportar HTML (Formato Netscape Bookmarks estándar)
    document.getElementById('btn-export').addEventListener('click', () => {
      let html = `<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<!-- This is an automatically generated file. -->\n<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>Bookmarks</TITLE>\n<H1>Marcadores de Brave</H1>\n<DL><p>\n`;
      bookmarks.forEach(b => {
        html += `    <DT><A HREF="${escapeHtml(b.url)}">${escapeHtml(b.title)}</A>\n`;
      });
      html += `</DL><p>\n`;

      const blob = new Blob([html], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `brave_marcadores_${new Date().toISOString().slice(0, 10)}.html`;
      a.click();
    });

    // Importar HTML
    const fileImport = document.getElementById('file-import');
    document.getElementById('btn-import').addEventListener('click', () => {
      fileImport.click();
    });

    fileImport.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (evt) => {
        const text = evt.target.result;
        const parser = new DOMParser();
        const doc = parser.parseFromString(text, 'text/html');
        const links = doc.querySelectorAll('a');
        let addedCount = 0;
        links.forEach(link => {
          const href = link.getAttribute('href');
          const title = link.textContent.trim() || href;
          if (href && /^https?:\/\//i.test(href)) {
            if (!bookmarks.some(b => b.url === href)) {
              bookmarks.push({ title, url: href });
              addedCount++;
            }
          }
        });
        await saveBookmarks();
        renderList();
        alert(`Se importaron ${addedCount} marcadores exitosamente.`);
      };
      reader.readAsText(file);
      fileImport.value = '';
    });

    window.addEventListener('brave-bridge-ready', loadBookmarks);
    loadBookmarks();
  </script>
</body>
</html>
