<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historial - Brave</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root {
      --bg-page: #19191c;
      --bg-card: #212226;
      --bg-card-hover: #26272d;
      --border-color: #2e2f38;
      --brave-orange: #fb542b;
      --brave-orange-dim: rgba(251, 84, 43, 0.15);
      --brave-orange-border: rgba(251, 84, 43, 0.4);
      --text-main: #ffffff;
      --text-muted: #9e9ea7;
      --text-sub: #72727d;
      --red: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      padding: 36px 0;
    }

    .page-wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Header */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-logo {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .title-text {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-clear {
      background: var(--brave-orange-dim);
      border: 1px solid var(--brave-orange-border);
      color: var(--brave-orange);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
    }
    .btn-clear:hover {
      background: var(--brave-orange);
      color: #ffffff;
    }

    .btn-batch-delete {
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.4);
      color: var(--red);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
      display: none;
    }
    .btn-batch-delete:hover {
      background: var(--red);
      color: #ffffff;
    }

    /* Search row */
    .search-box {
      width: 100%;
      display: flex;
      align-items: center;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 9px 16px;
      margin-bottom: 24px;
      gap: 10px;
      transition: border-color 0.15s;
    }
    .search-box:focus-within {
      border-color: var(--brave-orange);
    }
    .search-icon { font-size: 14px; color: var(--text-sub); }
    .search-box input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 14px;
    }
    .search-box input::placeholder { color: var(--text-sub); }
    .btn-clear-search {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 14px;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .btn-clear-search:hover { color: var(--text-main); }

    /* Groups and cards */
    .date-group {
      margin-bottom: 24px;
    }

    .date-header {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-sub);
      margin-bottom: 8px;
      padding-left: 4px;
    }

    .history-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .history-item {
      display: flex;
      align-items: center;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border-color);
      font-size: 13.5px;
      gap: 14px;
      transition: background 0.15s;
      cursor: pointer;
    }
    .history-item:last-child {
      border-bottom: none;
    }
    .history-item:hover {
      background-color: var(--bg-card-hover);
    }

    .item-checkbox {
      accent-color: var(--brave-orange);
      cursor: pointer;
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }

    .item-time {
      color: var(--text-sub);
      font-size: 12px;
      min-width: 44px;
      flex-shrink: 0;
    }

    .item-favicon {
      width: 18px;
      height: 18px;
      border-radius: 3px;
      flex-shrink: 0;
      object-fit: contain;
    }
    .item-favicon-fallback {
      font-size: 16px;
      width: 18px;
      display: inline-block;
      text-align: center;
    }

    .item-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
      text-decoration: none;
      color: var(--text-main);
    }
    .item-title {
      font-size: 13.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }
    .history-item:hover .item-title {
      color: var(--brave-orange);
      text-decoration: underline;
    }
    .item-url {
      color: var(--text-sub);
      font-size: 11.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-delete {
      color: var(--text-sub);
      cursor: pointer;
      font-size: 15px;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .item-delete:hover {
      color: var(--red);
      background-color: rgba(248, 113, 113, 0.1);
    }

    /* Empty state */
    .empty-state {
      padding: 64px 24px;
      text-align: center;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 52px; margin-bottom: 14px; opacity: 0.5; }
    .empty-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
    .empty-sub { font-size: 13px; color: var(--text-sub); }

    /* Toast */
    .history-toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #333;
      color: #fff;
      padding: 9px 18px;
      border-radius: 20px;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      opacity: 0;
      transition: all 0.25s;
      pointer-events: none;
      z-index: 99999;
      white-space: nowrap;
    }
    .history-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="header-bar">
      <div class="title-group">
        <img src="logo.png" class="title-logo" alt="Brave">
        <span class="title-text">Historial de navegación</span>
      </div>
      <div class="header-actions">
        <button class="btn-batch-delete" id="btn-batch-delete">Eliminar seleccionados (<span id="batch-count">0</span>)</button>
        <button class="btn-clear" id="btn-clear-all">Borrar historial</button>
      </div>
    </div>

    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Buscar en el historial..." autocomplete="off" spellcheck="false">
      <button class="btn-clear-search" id="btn-clear-search" style="display:none" title="Limpiar búsqueda">✕</button>
    </div>

    <div id="history-container">
      <!-- Se inyecta dinámicamente con grupos de fechas -->
    </div>
  </div>

  <div class="history-toast" id="history-toast"></div>

  <script>
    let historyItems = [];
    const selectedIds = new Set();

    function getDateGroup(dateStr) {
      if (!dateStr) return 'Antes';
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return 'Reciente';

      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
      const weekAgo = new Date(today); weekAgo.setDate(today.getDate() - 7);
      const monthAgo = new Date(today); monthAgo.setMonth(today.getMonth() - 1);
      const itemDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());

      if (itemDay >= today) return 'Hoy';
      if (itemDay >= yesterday) return 'Ayer';
      if (d >= weekAgo) return 'Esta semana';
      if (d >= monthAgo) return 'Este mes';
      return 'Más antiguo';
    }

    const GROUP_ORDER = ['Hoy', 'Ayer', 'Esta semana', 'Este mes', 'Más antiguo', 'Reciente', 'Antes'];

    function getFaviconUrl(url) {
      try {
        const u = new URL(url);
        return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=32`;
      } catch {
        return null;
      }
    }

    async function loadHistory() {
      if (window.braveAPI && window.braveAPI.getHistory) {
        try {
          const res = await window.braveAPI.getHistory();
          if (Array.isArray(res)) {
            historyItems = res;
            renderHistory();
            return;
          }
        } catch {}
      }

      try {
        historyItems = JSON.parse(localStorage.getItem('brave_browser_history') || '[]');
      } catch {
        historyItems = [];
      }
      renderHistory();
    }

    function renderHistory(filterText = '') {
      const container = document.getElementById('history-container');
      container.innerHTML = '';

      const q = filterText.toLowerCase().trim();
      const filtered = historyItems.filter(it => 
        (it.title || '').toLowerCase().includes(q) || 
        (it.url || '').toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🕒</div>
            <div class="empty-title">${historyItems.length > 0 ? 'Sin resultados' : 'No hay páginas en el historial'}</div>
            <div class="empty-sub">${historyItems.length > 0 ? 'Prueba con otra palabra clave.' : 'Las páginas que visites aparecerán aquí.'}</div>
          </div>
        `;
        updateBatchButton();
        return;
      }

      // Agrupar por fechas
      const groups = {};
      filtered.forEach((it) => {
        const g = getDateGroup(it.date);
        if (!groups[g]) groups[g] = [];
        groups[g].push(it);
      });

      GROUP_ORDER.forEach((groupName) => {
        if (!groups[groupName]) return;
        const groupEl = document.createElement('div');
        groupEl.className = 'date-group';

        const header = document.createElement('div');
        header.className = 'date-header';
        header.textContent = groupName;
        groupEl.appendChild(header);

        const card = document.createElement('div');
        card.className = 'history-card';

        groups[groupName].forEach((it) => {
          const itemId = it.id || it.url;
          const isSelected = selectedIds.has(itemId);
          const row = document.createElement('div');
          row.className = 'history-item';
          row.dataset.id = itemId;

          const favUrl = getFaviconUrl(it.url);

          row.innerHTML = `
            <input type="checkbox" class="item-checkbox" ${isSelected ? 'checked' : ''}>
            <span class="item-time">${escapeHtml(it.time || 'Reciente')}</span>
            ${favUrl 
              ? `<img class="item-favicon" src="${escapeAttr(favUrl)}" onerror="this.outerHTML='<span class=\\'item-favicon-fallback\\'>🌐</span>'">`
              : `<span class="item-favicon-fallback">🌐</span>`
            }
            <div class="item-info">
              <span class="item-title">${escapeHtml(it.title || 'Página Web')}</span>
              <span class="item-url">${escapeHtml(it.url)}</span>
            </div>
            <span class="item-delete" title="Eliminar del historial">✕</span>
          `;

          // Checkbox toggle
          const cb = row.querySelector('.item-checkbox');
          cb.addEventListener('click', (e) => {
            e.stopPropagation();
            if (cb.checked) {
              selectedIds.add(itemId);
            } else {
              selectedIds.delete(itemId);
            }
            updateBatchButton();
          });

          // Click on item opens url
          row.addEventListener('click', (e) => {
            if (e.target.closest('.item-delete') || e.target.closest('.item-checkbox')) return;
            window.location.href = it.url;
          });

          // Delete single item
          const delBtn = row.querySelector('.item-delete');
          delBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            await deleteItem(itemId);
          });

          card.appendChild(row);
        });

        groupEl.appendChild(card);
        container.appendChild(groupEl);
      });

      updateBatchButton();
    }

    async function deleteItem(idOrUrl) {
      if (window.braveAPI && window.braveAPI.deleteHistoryItem) {
        try { await window.braveAPI.deleteHistoryItem(idOrUrl); } catch {}
      }
      historyItems = historyItems.filter(x => (x.id || x.url) !== idOrUrl);
      selectedIds.delete(idOrUrl);
      try { localStorage.setItem('brave_browser_history', JSON.stringify(historyItems)); } catch {}
      renderHistory(document.getElementById('search-input').value);
      showToast('Elemento eliminado del historial');
    }

    function updateBatchButton() {
      const btn = document.getElementById('btn-batch-delete');
      const countEl = document.getElementById('batch-count');
      if (selectedIds.size > 0) {
        btn.style.display = 'block';
        countEl.textContent = selectedIds.size;
      } else {
        btn.style.display = 'none';
      }
    }

    document.getElementById('btn-batch-delete').addEventListener('click', async () => {
      if (selectedIds.size === 0) return;
      if (confirm(`¿Eliminar los ${selectedIds.size} elementos seleccionados del historial?`)) {
        for (const id of Array.from(selectedIds)) {
          if (window.braveAPI && window.braveAPI.deleteHistoryItem) {
            try { await window.braveAPI.deleteHistoryItem(id); } catch {}
          }
        }
        historyItems = historyItems.filter(x => !selectedIds.has(x.id || x.url));
        selectedIds.clear();
        try { localStorage.setItem('brave_browser_history', JSON.stringify(historyItems)); } catch {}
        renderHistory(document.getElementById('search-input').value);
        showToast('Elementos seleccionados eliminados');
      }
    });

    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('history-toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = String(text || '');
      return div.innerHTML;
    }

    function escapeAttr(text) {
      return (String(text || '')).replace(/"/g, '&quot;');
    }

    const searchInput = document.getElementById('search-input');
    const btnClearSearch = document.getElementById('btn-clear-search');

    searchInput.addEventListener('input', () => {
      btnClearSearch.style.display = searchInput.value ? 'block' : 'none';
      renderHistory(searchInput.value);
    });

    btnClearSearch.addEventListener('click', () => {
      searchInput.value = '';
      btnClearSearch.style.display = 'none';
      searchInput.focus();
      renderHistory();
    });

    document.getElementById('btn-clear-all').addEventListener('click', async () => {
      if (confirm('¿Estás seguro de que deseas borrar todo el historial de navegación?')) {
        if (window.braveAPI && window.braveAPI.clearHistory) {
          await window.braveAPI.clearHistory();
        }
        historyItems = [];
        selectedIds.clear();
        try { localStorage.removeItem('brave_browser_history'); } catch {}
        renderHistory();
        showToast('Historial de navegación borrado');
      }
    });

    window.addEventListener('brave-bridge-ready', loadHistory);
    window.addEventListener('storage', (e) => {
      if (!e.key || e.key === 'brave_browser_history') loadHistory();
    });
    loadHistory();
  </script>
</body>
</html>
