<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historial - Brave</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root {
      --bg-page: #19191c;
      --bg-card: #212226;
      --border-color: #2e2f38;
      --brave-orange: #fb542b;
      --text-main: #ffffff;
      --text-muted: #9e9ea7;
      --text-sub: #72727d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow-y: auto;
      padding: 36px 60px;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      max-width: 820px;
      width: 100%;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-icon {
      font-size: 26px;
    }

    .title-text {
      font-size: 24px;
      font-weight: 700;
    }

    .btn-clear {
      background: rgba(251, 84, 43, 0.15);
      border: 1px solid rgba(251, 84, 43, 0.4);
      color: var(--brave-orange);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-clear:hover {
      background: var(--brave-orange);
      color: #ffffff;
    }

    .search-box {
      width: 100%;
      max-width: 820px;
      display: flex;
      align-items: center;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 8px 18px;
      margin-bottom: 28px;
      gap: 10px;
    }

    .search-box input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 14.5px;
    }

    .history-card {
      width: 100%;
      max-width: 820px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .date-header {
      padding: 12px 20px;
      background-color: rgba(255, 255, 255, 0.03);
      font-size: 13px;
      font-weight: 700;
      color: var(--brave-orange);
      border-bottom: 1px solid var(--border-color);
    }

    .history-item {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border-color);
      font-size: 13.5px;
      gap: 16px;
      transition: background 0.15s;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-item:hover {
      background-color: rgba(255, 255, 255, 0.04);
    }

    .item-time {
      color: var(--text-sub);
      font-size: 12px;
      min-width: 48px;
    }

    .item-favicon {
      font-size: 16px;
    }

    .item-info {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-decoration: none;
      color: var(--text-main);
    }

    .item-info:hover {
      color: var(--brave-orange);
    }

    .item-url {
      color: var(--text-sub);
      font-size: 12px;
      margin-left: 8px;
    }

    .item-delete {
      opacity: 0.4;
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
      border-radius: 4px;
    }

    .item-delete:hover {
      opacity: 1;
      background-color: rgba(255, 255, 255, 0.1);
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="header-bar">
    <div class="title-group">
      <img src="logo.png" width="20" height="20" style="vertical-align: middle; margin-right: 8px; object-fit: contain;">
      <span class="title-text">Historial de navegación</span>
    </div>
    <button class="btn-clear" id="btn-clear-all">Borrar historial</button>
  </div>

  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="search-input" placeholder="Buscar en el historial...">
  </div>

  <div class="history-card" id="history-container">
    <div class="date-header">Hoy</div>
    <div id="history-list">
      <!-- Elementos se cargan dinámicamente -->
    </div>
  </div>

  <script>
    let historyItems = [];

    async function loadHistory() {
      if (window.braveAPI && window.braveAPI.getHistory) {
        try {
          historyItems = await window.braveAPI.getHistory();
          if (Array.isArray(historyItems)) {
            renderHistory();
            return;
          }
        } catch {}
      }

      try {
        historyItems = JSON.parse(localStorage.getItem('brave_browser_history') || '[]');
      } catch {
        historyItems = [];
      }
      renderHistory();
    }

    function renderHistory(filterText = '') {
      const listEl = document.getElementById('history-list');
      listEl.innerHTML = '';

      const q = filterText.toLowerCase().trim();
      const filtered = historyItems.filter(it => 
        (it.title || '').toLowerCase().includes(q) || 
        (it.url || '').toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        listEl.innerHTML = '<div class="empty-state">No hay páginas registradas en el historial.</div>';
        return;
      }

      filtered.forEach((it) => {
        const realIdx = historyItems.indexOf(it);
        const row = document.createElement('div');
        row.className = 'history-item';
        row.innerHTML = `
          <span class="item-time">${escapeHtml(it.time || 'Reciente')}</span>
          <span class="item-favicon">🌐</span>
          <a class="item-info" href="${escapeAttr(it.url)}">
            <span>${escapeHtml(it.title || 'Página Web')}</span>
            <span class="item-url">${escapeHtml(it.url)}</span>
          </a>
          <span class="item-delete" title="Eliminar del historial" data-idx="${realIdx}">✕</span>
        `;
        listEl.appendChild(row);
      });

      document.querySelectorAll('.item-delete').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const idx = parseInt(e.target.getAttribute('data-idx'), 10);
          if (window.braveAPI && window.braveAPI.deleteHistoryItem) {
            await window.braveAPI.deleteHistoryItem(idx);
          }
          historyItems.splice(idx, 1);
          localStorage.setItem('brave_browser_history', JSON.stringify(historyItems));
          renderHistory(document.getElementById('search-input').value);
        });
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function escapeAttr(text) {
      return (text || '').replace(/"/g, '&quot;');
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      renderHistory(e.target.value);
    });

    document.getElementById('btn-clear-all').addEventListener('click', async () => {
      if (confirm('¿Estás seguro de que deseas borrar todo el historial de navegación?')) {
        if (window.braveAPI && window.braveAPI.clearHistory) {
          await window.braveAPI.clearHistory();
        }
        historyItems = [];
        localStorage.removeItem('brave_browser_history');
        renderHistory();
      }
    });

    window.addEventListener('brave-bridge-ready', loadHistory);
    loadHistory();
  </script>
</body>
</html>
