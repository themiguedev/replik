<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Brave Playlist</title>
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #111215;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background-color: #191a1e;
      border-bottom: 1px solid #2d2e35;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 24px;
    }

    .brand-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand-subtitle {
      font-size: 12px;
      color: #9aa0a6;
      margin-left: 8px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      background-color: #292a30;
      border: 1px solid #383a42;
      color: #ffffff;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background-color: #353740;
    }

    .btn-danger {
      color: #f87171;
      border-color: rgba(248, 113, 113, 0.3);
    }

    .btn-danger:hover {
      background-color: rgba(248, 113, 113, 0.15);
    }

    .container {
      flex: 1;
      display: flex;
      padding: 24px 28px;
      gap: 24px;
    }

    /* Player Column */
    .player-col {
      flex: 1.4;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .player-box {
      width: 100%;
      height: 380px;
      background-color: #000000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2d2e35;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-box iframe,
    .player-box video {
      width: 100%;
      height: 100%;
      border: none;
    }

    .player-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      color: #72727d;
    }

    .player-meta {
      background-color: #191a1e;
      border: 1px solid #2d2e35;
      border-radius: 10px;
      padding: 14px 18px;
    }

    .player-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .player-source {
      font-size: 12px;
      color: #fb542b;
    }

    /* Playlist Queue Column */
    .queue-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #191a1e;
      border: 1px solid #2d2e35;
      border-radius: 12px;
      padding: 16px;
      height: calc(100vh - 120px);
    }

    .queue-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid #2d2e35;
    }

    .queue-count {
      font-size: 12px;
      color: #9aa0a6;
    }

    .queue-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: #212226;
      border: 1px solid #2d2e35;
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .queue-item:hover {
      background-color: #292a30;
      border-color: #3f414a;
    }

    .queue-item.active {
      border-color: #fb542b;
      background-color: rgba(251, 84, 43, 0.08);
    }

    .item-icon {
      font-size: 20px;
      flex-shrink: 0;
    }

    .item-details {
      flex: 1;
      min-width: 0;
    }

    .item-title {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f3f4;
    }

    .item-domain {
      font-size: 11px;
      color: #9aa0a6;
      margin-top: 2px;
    }

    .item-remove {
      color: #72727d;
      font-size: 14px;
      padding: 4px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .item-remove:hover {
      color: #f87171;
      background-color: rgba(248, 113, 113, 0.15);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #72727d;
      gap: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="logo.png" width="24" height="24" style="vertical-align: middle; margin-right: 8px; object-fit: contain;">
      <span class="brand-title">Brave Playlist</span>
      <span class="brand-subtitle">Reproducción de videos y audios sin anuncios</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-danger" id="btn-clear-playlist">🗑️ Vaciar Playlist</button>
    </div>
  </div>

  <div class="container">
    <!-- Reproductor Central -->
    <div class="player-col">
      <div class="player-box" id="player-container">
        <div class="player-empty" id="player-empty">
          <span style="font-size: 42px;">🎬</span>
          <span>Selecciona un elemento de tu playlist para reproducir</span>
        </div>
      </div>
      <div class="player-meta" id="player-meta" style="display: none;">
        <div class="player-title" id="current-title">Título del video</div>
        <div class="player-source" id="current-source">YouTube • Reproducción protegida por Brave Shields</div>
      </div>
    </div>

    <!-- Cola de Reproducción -->
    <div class="queue-col">
      <div class="queue-header">
        <span style="font-weight: 700; font-size: 14px;">Mi Lista en Cola</span>
        <span class="queue-count" id="queue-count">0 elementos</span>
      </div>
      <div class="queue-list" id="queue-list">
        <!-- Elementos inyectados dinámicamente -->
      </div>
    </div>
  </div>

  <script>
    let playlist = [];
    let currentIndex = -1;

    async function loadPlaylist() {
      if (window.braveAPI && window.braveAPI.getPlaylist) {
        try {
          const list = await window.braveAPI.getPlaylist();
          if (Array.isArray(list)) {
            playlist = list;
            renderQueue();
            if (playlist.length > 0 && currentIndex === -1) {
              playItem(0);
            }
            return;
          }
        } catch {}
      }
      try {
        const raw = localStorage.getItem('brave_playlist_items');
        playlist = raw ? JSON.parse(raw) : [];
      } catch {
        playlist = [];
      }
      renderQueue();
      if (playlist.length > 0 && currentIndex === -1) {
        playItem(0);
      }
    }

    async function savePlaylist() {
      localStorage.setItem('brave_playlist_items', JSON.stringify(playlist));
      if (window.braveAPI && window.braveAPI.savePlaylist) {
        try { await window.braveAPI.savePlaylist(playlist); } catch {}
      }
      renderQueue();
    }

    function renderQueue() {
      const listEl = document.getElementById('queue-list');
      const countEl = document.getElementById('queue-count');
      countEl.textContent = `${playlist.length} elemento${playlist.length === 1 ? '' : 's'}`;

      if (playlist.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <span style="font-size: 32px;">📭</span>
            <span>Tu playlist está vacía.</span>
            <span style="font-size: 11px;">Haz clic en el botón 📑 de la barra al ver un video para guardarlo.</span>
          </div>
        `;
        document.getElementById('player-container').innerHTML = `
          <div class="player-empty">
            <span style="font-size: 42px;">🎬</span>
            <span>No hay elementos en reproducción</span>
          </div>
        `;
        document.getElementById('player-meta').style.display = 'none';
        return;
      }

      listEl.innerHTML = '';
      playlist.forEach((item, idx) => {
        let itemDomain = item.domain;
        if (!itemDomain && item.url) {
          try { itemDomain = new URL(item.url).hostname; } catch { itemDomain = 'web'; }
        }
        itemDomain = itemDomain || 'web';
        const isYouTube = itemDomain.includes('youtube') || (item.url && item.url.includes('youtu'));

        const el = document.createElement('div');
        el.className = 'queue-item' + (idx === currentIndex ? ' active' : '');
        el.innerHTML = `
          <span class="item-icon">${isYouTube ? '▶️' : '🎵'}</span>
          <div class="item-details">
            <div class="item-title">${item.title || 'Elemento sin título'}</div>
            <div class="item-domain">${itemDomain}</div>
          </div>
          <span class="item-remove" title="Eliminar de playlist">✕</span>
        `;

        el.addEventListener('click', (e) => {
          if (e.target.classList.contains('item-remove')) {
            e.stopPropagation();
            removeItem(idx);
          } else {
            playItem(idx);
          }
        });

        listEl.appendChild(el);
      });
    }

    function playItem(idx) {
      if (idx < 0 || idx >= playlist.length) return;
      currentIndex = idx;
      const item = playlist[idx];

      const playerContainer = document.getElementById('player-container');
      const playerMeta = document.getElementById('player-meta');
      const titleEl = document.getElementById('current-title');
      const sourceEl = document.getElementById('current-source');

      let itemDomain = item.domain;
      if (!itemDomain && item.url) {
        try { itemDomain = new URL(item.url).hostname; } catch { itemDomain = 'web'; }
      }
      itemDomain = itemDomain || 'web';

      titleEl.textContent = item.title || 'Video en reproducción';
      sourceEl.textContent = `${itemDomain} • Sin interrupciones comerciales`;
      playerMeta.style.display = 'block';

      if (item.url.includes('youtube.com/watch?v=')) {
        const videoId = item.url.split('v=')[1].split('&')[0];
        playerContainer.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&enablejsapi=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      } else if (item.url.includes('youtu.be/')) {
        const videoId = item.url.split('youtu.be/')[1].split('?')[0];
        playerContainer.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&enablejsapi=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      } else {
        playerContainer.innerHTML = `<iframe src="${item.url}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      }

      renderQueue();
    }

    function removeItem(idx) {
      playlist.splice(idx, 1);
      if (currentIndex >= playlist.length) {
        currentIndex = playlist.length - 1;
      }
      savePlaylist();
      if (currentIndex >= 0) {
        playItem(currentIndex);
      }
    }

    document.getElementById('btn-clear-playlist').addEventListener('click', () => {
      if (confirm('¿Vaciar todos los elementos de Brave Playlist?')) {
        playlist = [];
        currentIndex = -1;
        savePlaylist();
      }
    });

    window.addEventListener('storage', (e) => {
      if (e.key === 'brave_playlist_items') {
        loadPlaylist();
      }
    });

    window.addEventListener('brave-bridge-ready', loadPlaylist);
    loadPlaylist();
  </script>
</body>
</html>
